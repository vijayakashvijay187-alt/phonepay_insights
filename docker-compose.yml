    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: map_transaction
    ports: ["5604:5432"]
    volumes:
      - phonepe_map_transaction:/var/lib/postgresql/data
      - ./sql/map_transaction.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d map_transaction"]
      interval: 5s
      timeout: 3s
      retries: 20

  map_user:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: map_user
    ports: ["5605:5432"]
    volumes:
      - phonepe_map_user:/var/lib/postgresql/data
      - ./sql/map_user.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d map_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  map_merchant:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: map_merchant
    ports: ["5606:5432"]
    volumes:
      - phonepe_map_merchant:/var/lib/postgresql/data
      - ./sql/map_merchant.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d map_merchant"]
      interval: 5s
      timeout: 3s
      retries: 20

  top_transaction:
