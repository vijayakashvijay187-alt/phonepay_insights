      - phonepe_top_user:/var/lib/postgresql/data
      - ./sql/top_user.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d top_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  top_merchant:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
