  phonepe_aggregated_transaction:
  phonepe_aggregated_user:
  phonepe_aggregated_merchant:
  phonepe_map_transaction:
  phonepe_map_user:
  phonepe_map_merchant:
  phonepe_top_transaction:
  phonepe_top_user:
  phonepe_top_merchant:
