    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: top_transaction
    ports: ["5607:5432"]
    volumes:
      - phonepe_top_transaction:/var/lib/postgresql/data
      - ./sql/top_transaction.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d top_transaction"]
      interval: 5s
