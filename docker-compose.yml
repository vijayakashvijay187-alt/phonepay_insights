name: phonepe_insights

x-pg: &pg
  image: postgres:16-alpine
  command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
  restart: "no"

services:
  aggregated_transaction:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aggregated_transaction
    ports: ["5601:5432"]
    volumes:
      - phonepe_aggregated_transaction:/var/lib/postgresql/data
      - ./sql/aggregated_transaction.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aggregated_transaction"]
      interval: 5s
      timeout: 3s
      retries: 20

  aggregated_user:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aggregated_user
    ports: ["5602:5432"]
    volumes:
      - phonepe_aggregated_user:/var/lib/postgresql/data
      - ./sql/aggregated_user.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aggregated_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  aggregated_merchant:
    <<: *pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aggregated_merchant
    ports: ["5603:5432"]
    volumes:
      - phonepe_aggregated_merchant:/var/lib/postgresql/data
      - ./sql/aggregated_merchant.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aggregated_merchant"]
      interval: 5s
      timeout: 3s
      retries: 20

  map_transaction:
